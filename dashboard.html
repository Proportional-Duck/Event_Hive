<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Console | EventHive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar { padding: 24px 0; display: flex; flex-direction: column; }
        .sidebar-logo { padding: 0 16px; margin-bottom: 32px; color: var(--primary); display: flex; align-items: center; }
        .sidebar-role { font-size: 10px; text-transform: uppercase; color: var(--text-tertiary); letter-spacing: 0.8px; padding: 0 16px; margin-bottom: 12px; }
        .nav-group { margin-bottom: 24px; }
        
        .metric-card { background: var(--bg-secondary); border-radius: 12px; padding: 20px; border: 0.5px solid var(--border-default); }
        .metric-value { font-size: 28px; font-weight: 600; margin-top: 8px; }
        
        .section-card { background: white; border: 0.5px solid var(--border-default); border-radius: 12px; padding: 24px; height: 100%; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-content { background: white; width: 440px; border-radius: 16px; padding: 32px; border: 0.5px solid var(--border-default); }
        
        .data-list-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 0.5px solid var(--border-default); font-size: 13px; }
        .data-list-row:last-child { border-bottom: none; }

        .task-tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; font-weight: 600; text-transform: uppercase; }
        
        #view-container { animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="app-wrapper">

    <!-- Navigation -->
    <aside class="sidebar">
        <div class="sidebar-logo" onclick="location.href='index.html'" style="cursor:pointer">
            <i class="fa-solid fa-hive" style="font-size: 24px; margin-right: 12px;"></i>
            <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.5px;">EventHive</span>
        </div>
        <div class="sidebar-role" id="role-label">Stakeholder</div>
        <nav id="main-nav" class="nav-group"></nav>
        <div style="margin-top: auto; padding: 16px;">
            <div class="nav-item" onclick="openLogout()"><i class="fa-solid fa-power-off"></i><span>Sign out</span></div>
        </div>
    </aside>

    <!-- Content -->
    <main class="main-content">
        <header class="topbar">
            <div style="font-weight: 600; font-size: 15px;" id="current-view-name">Overview</div>
            <div style="display: flex; align-items: center; gap: 20px;">
                <div class="badge" id="role-pill" style="padding: 4px 12px; background: var(--primary-light); color: var(--primary);">Role</div>
                <div id="user-circle" style="width: 34px; height: 34px; background: #1A1A19; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; cursor: pointer;">??</div>
            </div>
        </header>

        <div style="padding: 32px; max-width: 1200px;" id="view-container">
            <!-- Dynamic Content Injected Here -->
        </div>
    </main>

    <div id="session-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Schedule Planning Session</h3>
            <form onsubmit="handleCreateSession(event)">
                <div class="form-group"><label>Session Name / Objective</label><input type="text" id="sn-title" class="form-control" placeholder="e.g. Q3 Roadmap Review" required></div>
                <div class="form-group"><label>Client / Department</label><input type="text" id="sn-client" class="form-control" placeholder="Acme Corp" required></div>
                <div class="form-group"><label>Session Date</label><input type="date" id="sn-date" class="form-control" required></div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('session-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Take Session</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Global Modals -->
    <div id="event-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Create New Event</h3>
            <form onsubmit="handleCreateEvent(event)">
                <div class="form-group"><label>Source Session (Required)</label><select id="ev-session" class="form-control" required></select></div>
                <div class="form-group"><label>Event Name</label><input type="text" id="ev-name" class="form-control" required></div>
                <div class="form-group"><label>Planned Date</label><input type="date" id="ev-date" class="form-control" required></div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('event-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Create Event</button>
                </div>
            </form>
        </div>
    </div>

    <div id="task-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Assign New Task</h3>
            <form onsubmit="handleCreateTask(event)">
                <div class="form-group"><label>Event Context</label><select id="tk-event" class="form-control" id="tk-ev-list"></select></div>
                <div class="form-group"><label>Task Details</label><input type="text" id="tk-name" class="form-control" placeholder="What needs to be done?" required></div>
                <div class="form-group"><label>Assignee</label><select id="tk-user" class="form-control"><option>Mike Staff</option><option>Sarah Planner</option><option>George Catering</option></select></div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('task-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Create Task</button>
                </div>
            </form>
        </div>
    </div> <!-- Ensure task-modal is properly closed -->

    <div id="payment-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom: 20px;">Secure Payment Gateway</h3>
            <form onsubmit="handlePaymentSubmit(event)">
                <div class="form-group" style="display:flex; gap:16px; margin-bottom:16px; flex-wrap:wrap">
                    <label style="display:flex; align-items:center; gap:8px"><input type="radio" name="paymethod" required checked> <i class="fa-brands fa-cc-visa" style="font-size:24px; color:#1434CB"></i></label>
                    <label style="display:flex; align-items:center; gap:8px"><input type="radio" name="paymethod" required> <i class="fa-brands fa-cc-mastercard" style="font-size:24px; color:#EB001B"></i></label>
                    <label style="display:flex; align-items:center; gap:8px"><input type="radio" name="paymethod" required> <i class="fa-brands fa-paypal" style="font-size:24px; color:#003087"></i></label>
                    <label style="display:flex; align-items:center; gap:8px"><input type="radio" name="paymethod" required> <i class="fa-brands fa-cc-apple-pay" style="font-size:24px; color:#000000"></i></label>
                </div>
                <div class="form-group"><label>Cardholder Name</label><input type="text" class="form-control" required placeholder="John Doe"></div>
                <div class="form-group"><label>Card Number</label><input type="text" class="form-control" required placeholder="XXXX XXXX XXXX XXXX" maxlength="19"></div>
                <div style="display:flex; gap:16px">
                    <div class="form-group" style="flex:1"><label>Expiry Date</label><input type="text" class="form-control" required placeholder="MM/YY"></div>
                    <div class="form-group" style="flex:1"><label>CVV</label><input type="text" class="form-control" required placeholder="123" maxlength="3"></div>
                </div>
                <div style="display: flex; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn btn-secondary" style="flex: 1;" onclick="closeModal('payment-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Pay $20,000.00</button>
                </div>
            </form>
        </div>
    </div>

    <script src="store.js"></script>
    <script src="common.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('currentUser')) || { role: 'organizer', name: 'Demo User' };
        let currentView = 'Dashboard';

        function init() {
            document.getElementById('role-label').innerText = user.role;
            document.getElementById('role-pill').innerText = user.role;
            document.getElementById('user-circle').innerText = user.name.split(' ').map(n=>n[0]).join('');
            renderNav();
            switchView('Dashboard');
        }

        function renderNav() {
            const nav = document.getElementById('main-nav');
            const menu = {
                admin:     [{n:'Dashboard', i:'fa-gauge-high'}, {n:'Users', i:'fa-users'}, {n:'Events', i:'fa-calendar'}, {n:'System', i:'fa-server'}, {n:'Reports', i:'fa-chart-pie'}, {n:'Alerts', i:'fa-bell'}],
                organizer: [{n:'Dashboard', i:'fa-gauge-high'}, {n:'Sessions', i:'fa-handshake'}, {n:'Projects', i:'fa-calendar-days'}, {n:'Task Manager', i:'fa-list-check'}, {n:'Budgeting', i:'fa-calculator'}, {n:'Marketplace', i:'fa-store'}, {n:'Reports', i:'fa-chart-pie'}, {n:'Alerts', i:'fa-bell'}],
                store:     [{n:'Dashboard', i:'fa-gauge-high'}, {n:'Bookings', i:'fa-calendar-check'}, {n:'Catalog', i:'fa-box'}, {n:'Earnings', i:'fa-dollar-sign'}],
                employee:  [{n:'Dashboard', i:'fa-gauge-high'}, {n:'My Shift', i:'fa-clock'}, {n:'Tasks', i:'fa-list-check'}],
                sponsor:   [{n:'Dashboard', i:'fa-gauge-high'}, {n:'Offers', i:'fa-handshake'}, {n:'Branding', i:'fa-bullhorn'}],
                attendee:  [{n:'Dashboard', i:'fa-gauge-high'}, {n:'My Access', i:'fa-ticket'}, {n:'Schedule', i:'fa-clock'}]
            };
            const items = menu[user.role] || [{n:'Dashboard', i:'fa-gauge-high'}];
            nav.innerHTML = items.map(item => `
                <div class="nav-item ${item.n === currentView ? 'active' : ''}" onclick="switchView('${item.n}')">
                    <i class="fa-solid ${item.i}"></i><span>${item.n}</span>
                </div>
            `).join('');
        }

        function switchView(view) {
            if (view === 'Marketplace') { location.href = 'marketplace.html'; return; }
            currentView = view;
            document.getElementById('current-view-name').innerText = view;
            renderNav();
            const container = document.getElementById('view-container');
            
            if (view === 'Dashboard') renderDashboard(container);
            else if (view === 'Sessions') renderSessions(container);
            else if (view === 'Task Manager' || view === 'Tasks') renderTasks(container);
            else if (view === 'Projects' || view === 'Events') renderProjects(container);
            else if (view === 'Bookings') renderBookings(container);
            else if (view === 'Offers') renderOffers(container);
            else if (view === 'Branding') renderBranding(container);
            else if (view === 'My Access') renderAttendeeAccess(container);
            else if (view === 'My Shift') renderMyShift(container);
            else if (view === 'Users') renderUsers(container);
            else if (view === 'System') renderSystem(container);
            else if (view === 'Catalog') renderCatalog(container);
            else if (view === 'Finances' || view === 'Earnings') renderFinances(container);
            else if (view === 'Budgeting') renderBudgeting(container);
            else if (view === 'Sponsor Market') renderSponsorMarket(container);
            else if (view === 'Reports') renderReports(container);
            else if (view === 'Alerts') renderAlerts(container);
            else if (view === 'Schedule') renderSchedule(container);
            else container.innerHTML = `<div class="section-card"><p class="text-tertiary">Module "${view}" is initialized and ready for deployment.</p></div>`;
        }

        function renderDashboard(cont) {
            let roleHtml = '';
            if (user.role === 'organizer') {
                roleHtml = `
                    <div class="grid grid-4" style="margin-bottom:32px">
                        <div class="metric-card"><div class="text-tertiary">Live Events</div><div class="metric-value">${DataStore.getEvents().length}</div></div>
                        <div class="metric-card"><div class="text-tertiary">Open Tasks</div><div class="metric-value">${DataStore.getTasks().filter(t=>t.status==='todo').length}</div></div>
                        <div class="metric-card"><div class="text-tertiary">Staff Active</div><div class="metric-value">12</div></div>
                        <div class="metric-card"><div class="text-tertiary">Budget Used</div><div class="metric-value">72%</div></div>
                    </div>
                `;
            } else if (user.role === 'store') {
                roleHtml = `
                    <div class="grid grid-4" style="margin-bottom:32px">
                        <div class="metric-card"><div class="text-tertiary">Total Bookings</div><div class="metric-value">${DataStore.getBookings().length}</div></div>
                        <div class="metric-card"><div class="text-tertiary">Pending Res.</div><div class="metric-value">3</div></div>
                        <div class="metric-card"><div class="text-tertiary">Earnings</div><div class="metric-value">$8,450</div></div>
                        <div class="metric-card"><div class="text-tertiary">Profile Views</div><div class="metric-value">1.2k</div></div>
                    </div>
                `;
            } else if (user.role === 'employee') {
                roleHtml = `
                    <div class="grid grid-2" style="margin-bottom:32px; gap:24px">
                        <div class="metric-card"><div class="text-tertiary">Tasks for Today</div><div class="metric-value">5</div></div>
                        <div class="metric-card"><div class="text-tertiary">Shift Status</div><div class="metric-value">On Break</div></div>
                    </div>
                `;
            } else {
                roleHtml = `<div class="metric-card" style="margin-bottom:32px">Welcome back to your workspace.</div>`;
            }

            cont.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:32px">
                    <div><h1 style="font-size:28px; font-weight:700">Hello, ${user.name.split(' ')[0]}</h1><p class="text-secondary">Dashboard tailored for ${user.role} role.</p></div>
                    ${user.role === 'organizer' ? '<button class="btn btn-primary" onclick="openModal(\'event-modal\')">+ New Event</button>' : ''}
                </div>
                ${roleHtml}
                <div class="grid grid-2" style="gap:32px">
                    <div class="section-card"><h3>Recent Updates</h3><div id="recent-list"></div></div>
                    <div class="section-card"><h3>Quick Access</h3>
                        <div class="btn btn-secondary" style="width:100%; margin-bottom:12px" onclick="switchView('${user.role === 'organizer' ? 'Projects' : 'Dashboard'}')">View Active Work</div>
                        <div class="btn btn-secondary" style="width:100%" onclick="location.href='index.html'">Visit Homepage</div>
                    </div>
                </div>
            `;
            const list = document.getElementById('recent-list');
            list.innerHTML = DataStore.getEvents().slice(0, 3).map(e => `<div class="data-list-row"><div><b>${e.name}</b><br><small class="text-tertiary">${e.date}</small></div></div>`).join('');
        }

        function renderTasks(cont) {
            const tasks = DataStore.getTasks();
            cont.innerHTML = `
                <div class="section-header" style="margin-bottom:32px">
                    <h2>Task Management Center</h2>
                    ${user.role === 'organizer' ? '<button class="btn btn-primary" onclick="openModal(\'task-modal\')">+ Create Task</button>' : ''}
                </div>
                <div class="grid grid-1" style="gap:16px">
                    ${tasks.map(t => `
                        <div class="section-card" style="padding:16px; border-left: 4px solid ${t.status==='done'?'var(--success-text)':'var(--primary)'}">
                            <div style="display:flex; justify-content:space-between; align-items:center">
                                <div><b>${t.text}</b><br><small class="text-tertiary">Assigned to: ${t.assignee}</small></div>
                                <div style="display:flex; align-items:center; gap:12px">
                                    <span class="task-tag" style="background:${t.status==='done'?'var(--success-fill)':'var(--primary-light)'}; color:${t.status==='done'?'var(--success-text)':'var(--primary)'}">${t.status}</span>
                                    <button class="btn btn-ghost" onclick="toggleTaskStatus('${t.id}', '${t.status}')">${t.status==='done'?'Reopen':'Complete'}</button>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderProjects(cont) {
            const events = DataStore.getEvents();
            cont.innerHTML = `
                <div class="section-header" style="margin-bottom:32px"><h2>Active Event Portfolio</h2></div>
                <div class="section-card">
                    ${events.map(e => `
                        <div class="data-list-row">
                            <div style="flex:1"><b>${e.name}</b><br><small class="text-tertiary">ID: ${e.id} • Code: <b>${e.code}</b></small></div>
                            <div style="margin-right:20px">${e.date}</div>
                            <span class="badge badge-success">${e.status}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderBookings(cont) {
            const bks = DataStore.getBookings();
            cont.innerHTML = `
                <div class="section-header" style="margin-bottom:32px"><h2>Client Bookings & Requests</h2></div>
                <div class="grid grid-1" style="gap:16px">
                    ${bks.map(b => `
                        <div class="section-card" style="padding:16px">
                            <div style="display:flex; justify-content:space-between; align-items:center">
                                <div><b>${b.eventName}</b><br><small>${b.client} • $${b.amount}</small></div>
                                <div style="display:flex; gap:8px">
                                    <button class="btn btn-secondary" style="color:var(--success-text); border-color:var(--success-text)">Accept</button>
                                    <button class="btn btn-ghost" style="color:var(--error-text)">Decline</button>
                                </div>
                            </div>
                        </div>
                    `).join('') || '<p class="text-tertiary">Refreshing booking feed...</p>'}
                </div>
            `;
        }

        function renderOffers(cont) {
            let offers = DataStore.getOffers();
            // Fallback mock data in case local storage is stale
            if (offers.length === 0) {
                offers = [
                    { title: 'Gold Tier Sponsoring', value: '$10,000', event: 'Web Dev Summit', status: 'Accepted' },
                    { title: 'Lanyard Branding', value: '$2,500', event: 'Corporate Gala', status: 'Pending' },
                    { title: 'Main Stage Banner', value: '$5,000', event: 'Music Fest', status: 'Active' },
                    { title: 'VIP Lounge Host', value: '$15,000', event: 'Design Conference', status: 'Accepted' },
                    { title: 'Coffee Cart Sponsor', value: '$1,500', event: 'Startup Pitch Night', status: 'Pending' },
                    { title: 'Wi-Fi Network Branding', value: '$3,000', event: 'Tech Summit', status: 'Accepted' }
                ];
            }
            cont.innerHTML = `
                <div class="section-header" style="margin-bottom:32px"><h2>Active Sponsorship Offers</h2></div>
                <div class="grid grid-2" style="gap:24px">
                    ${offers.map(o => `
                        <div class="section-card" style="border-top: 4px solid var(--primary)">
                            <div style="font-size:11px; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:8px">${o.event}</div>
                            <h3 style="margin-bottom:12px">${o.title}</h3>
                            <div style="display:flex; justify-content:space-between; align-items:center">
                                <span style="font-size:18px; font-weight:700">${o.value}</span>
                                <span class="badge ${o.status==='Accepted'?'badge-success':'badge-warning'}">${o.status}</span>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function renderBranding(cont) {
            cont.innerHTML = `
                <div class="section-header" style="margin-bottom:32px"><h2>Sponsorship Portfolio</h2></div>
                <div class="section-card">
                    <div class="data-list-row"><div>Logo Asset (SVG)</div><div style="flex:1"></div><button class="btn btn-ghost">Replace</button></div>
                    <div class="data-list-row"><div>Brand Guidelines</div><div style="flex:1"></div><button class="btn btn-ghost">Download</button></div>
                    <div style="margin-top:24px; padding:20px; border-radius:12px; border:1px dashed var(--border-default); text-align:center">
                        <p class="text-tertiary">Drag and drop your company logo here to update branding across sponsored events.</p>
                    </div>
                </div>
            `;
        }

        function renderAttendeeAccess(cont) {
            cont.innerHTML = `
                <div class="section-header" style="margin-bottom:32px"><h2>My Event Access</h2></div>
                <div class="section-card" style="text-align:center; padding:40px">
                    <i class="fa-solid fa-qrcode" style="font-size:80px; color:var(--primary); margin-bottom:24px"></i>
                    <p style="font-weight:600">Your Master Access Token</p>
                    <p class="text-tertiary" style="font-size:13px; margin-bottom:24px">Show this QR at the venue entrance. Valid for all booked sessions.</p>
                    <button class="btn btn-primary" onclick="showNotification('Digital pass downloaded successfully.', 'success')">Download Wallet Pass</button>
                </div>
            `;
        }

        function toggleTaskStatus(id, current) {
            const next = current === 'done' ? 'todo' : 'done';
            DataStore.updateTaskStatus(id, next);
            showNotification(`Task status updated.`, 'info');
            renderTasks(document.getElementById('view-container'));
        }

        function renderSessions(cont) {
            const sessions = DataStore.getSessions();
            cont.innerHTML = `
                <div class="section-header" style="margin-bottom:32px">
                    <h2>Planning Sessions</h2>
                    <button class="btn btn-primary" onclick="openModal('session-modal')">+ Take Session</button>
                </div>
                <div class="grid grid-2" style="gap:24px">
                    ${sessions.map(s => `
                        <div class="section-card" style="border-top: 4px solid var(--primary)">
                            <div style="display:flex; justify-content:space-between; margin-bottom:12px">
                                <span class="badge ${s.status === 'Active' ? 'badge-success' : 'badge-neutral'}">${s.status}</span>
                                <span style="font-size:12px; color:var(--text-tertiary)">${s.date}</span>
                            </div>
                            <h3 style="margin-bottom:4px">${s.title}</h3>
                            <p class="text-secondary" style="font-size:13px; margin-bottom:20px"><i class="fa-solid fa-user-tie"></i> Client: ${s.client}</p>
                            <button class="btn btn-secondary" style="width:100%" onclick="prepEventFromSession('${s.id}')">Convert to Event</button>
                        </div>
                    `).join('') || '<p class="text-tertiary">No sessions taken yet. You must take a session before creating an event.</p>'}
                </div>
            `;
        }

        function prepEventFromSession(sessionId) {
            openModal('event-modal');
            const select = document.getElementById('ev-session');
            select.value = sessionId;
        }

        function openModal(id) { 
            if (id === 'task-modal') {
                const el = document.getElementById('tk-event');
                el.innerHTML = DataStore.getEvents().map(e => `<option>${e.name}</option>`).join('') || '<option>Global Task</option>';
            }
            if (id === 'event-modal') {
                const el = document.getElementById('ev-session');
                const sessions = DataStore.getSessions();
                if (sessions.length === 0) {
                    showNotification('You must take a session first before creating an event.', 'error');
                    return;
                }
                el.innerHTML = sessions.map(s => `<option value="${s.id}">${s.title} (${s.client})</option>`).join('');
            }
            document.getElementById(id).style.display = 'flex'; 
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        
        // --- NEW MODULE RENDERS ---
        function renderMyShift(cont) {
            cont.innerHTML = `
                <div class="section-header" style="margin-bottom:32px"><h2>Shift Schedule & Assignments</h2></div>
                <div class="grid grid-3" style="gap:24px; margin-bottom:32px">
                    <div class="metric-card"><div class="text-tertiary">Current Status</div><div class="metric-value text-success" style="font-size:24px"><i class="fa-solid fa-circle"></i> Clocked In</div></div>

        function triggerNotificationTest(btn) {
            const container = document.getElementById('alerts-container');
            const alertId = 'N' + Date.now();
            btn.innerText = "Dispatching...";
            btn.disabled = true;

            const newItem = document.createElement('div');
            newItem.className = 'section-card';
            newItem.style = 'padding:16px; border-left:4px solid var(--error-text); background: var(--bg-secondary); transition: all 0.3s;';
            newItem.innerHTML = `
                <div style="display:flex; justify-content:space-between; margin-bottom:4px">
                    <b>System Push Notification</b> <small class="text-tertiary" id="time-${alertId}">Just now</small>
                </div>
                <p class="text-secondary" style="font-size:13px; font-family:monospace" id="status-${alertId}">Sending... [Attempt 1/3]</p>
            `;
            container.prepend(newItem);

            setTimeout(() => { document.getElementById('status-'+alertId).innerText = "Delivery failed. Retrying... [Attempt 2/3]"; }, 1500);
            setTimeout(() => { document.getElementById('status-'+alertId).innerText = "Delivery failed. Retrying... [Attempt 3/3]"; }, 3000);
            setTimeout(() => { 
                document.getElementById('status-'+alertId).innerText = "Delivery Confirmed (Acknowledge packet received)."; 
                document.getElementById('status-'+alertId).style.color = "var(--success-text)"; 
                newItem.style.borderLeftColor = "var(--success-text)";
                btn.innerText = "Trigger Delivery Test";
                btn.disabled = false;
                showNotification('Notification Delivered', 'success');
            }, 4800);
        }
