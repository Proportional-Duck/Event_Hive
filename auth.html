<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication | EventHive</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">

    <div style="text-align: center;">
        <div style="margin-bottom: 24px; cursor: pointer;" onclick="location.href='index.html'">
            <i class="fa-solid fa-hive" style="font-size: 38px; color: var(--primary);"></i>
            <div style="font-size: 22px; font-weight: 700; margin-top: 8px;">EventHive</div>
        </div>

        <div class="auth-card">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign in</div>
                <div class="auth-tab" id="tab-reg" onclick="switchTab('reg')">Create account</div>
            </div>

            <!-- Login -->
            <form id="form-login" onsubmit="handleLogin(event)">
                <div class="form-group" style="text-align: left;">
                    <label>Email address</label>
                    <input type="email" id="login-email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                        <label style="margin:0">Password</label>
                        <a href="#" class="text-tertiary" style="font-size: 11px;">Forgot?</a>
                    </div>
                    <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 12px;">Sign in to Platform</button>
            </form>

            <!-- Register -->
            <form id="form-reg" onsubmit="handleReg(event)" style="display: none;">
                <div class="form-group" style="text-align: left;">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Email address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Professional Role</label>
                    <select id="reg-role" class="form-control" required>
                        <option value="organizer">Organizer</option>
                        <option value="store">Vendor / Store</option>
                        <option value="employee">Team Member</option>
                        <option value="sponsor">Sponsor</option>
                        <option value="admin">System Admin</option>
                    </select>
                </div>
                <div class="form-group" style="text-align: left;">
                    <label>Create Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 12px;">Join EventHive</button>
            </form>
        </div>
        <p class="text-tertiary" style="margin-top: 24px; font-size: 12px;">Demo Login: admin@eh.com or org@eh.com</p>
    </div>

    <script src="store.js"></script>
    <script src="common.js"></script>
    <script>
        // Handle role pre-selection
        const params = new URLSearchParams(window.location.search);
        const urlRole = params.get('role');
        if (urlRole) document.getElementById('reg-role').value = urlRole;

        function switchTab(t) {
            document.getElementById('form-login').style.display = t === 'login' ? 'block' : 'none';
            document.getElementById('form-reg').style.display = t === 'reg' ? 'block' : 'none';
            document.getElementById('tab-login').className = `auth-tab ${t==='login'?'active':''}`;
            document.getElementById('tab-reg').className = `auth-tab ${t==='reg'?'active':''}`;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const users = DataStore.getUsers();
            
            // For demo purposes, we accept the core roles if credentials match or just basic pass
            const user = users.find(u => u.email === email);
            if (user) {
                localStorage.setItem('currentUser', JSON.stringify(user));
                showNotification(`Welcome back, ${user.name}`, 'success');
                setTimeout(() => location.href = 'dashboard.html', 800);
            } else {
                // Default fallback for demo
                const fallbackRole = urlRole || 'organizer';
                const demoUser = { name: email.split('@')[0], role: fallbackRole, email: email };
                localStorage.setItem('currentUser', JSON.stringify(demoUser));
                location.href = 'dashboard.html';
            }
        }

        function handleReg(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const role = document.getElementById('reg-role').value;
            
            const newUser = { name, email, role };
            DataStore.saveUser(newUser);
            localStorage.setItem('currentUser', JSON.stringify(newUser));
            
            showNotification('Account created!', 'success');
            setTimeout(() => location.href = 'dashboard.html', 1000);
        }
    </script>
</body>
</html>
